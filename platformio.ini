; ====================================================================
; PlatformIO Configuration: DIYMORE ESP32-S3 3.5" IPS Touch Display
; XiaoZhi AI Compatible • 480x320 ST7796 IPS + Capacitive I2C Touch
; Drivers: LovyanGFX (40MHz DMA) + LVGL 8.3.11 + TJpgDec
; Hardware: ESP32-S3 (N16R8) 16MB Flash, 8MB Octal OPI PSRAM
; ====================================================================

[platformio]
default_envs = esp32-s3-mini-os
src_dir = src
include_dir = include

[env:esp32-s3-mini-os]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload configuration (Tự động nhận diện cổng USB hoặc bỏ comment để gán cứng)
monitor_speed = 115200
upload_speed = 921600
; upload_port = COM3
; monitor_port = COM3
monitor_filters = esp32_exception_decoder

; Hardware specifications
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; Memory type: OPI PSRAM (Octal) for N16R8/N8R8 boards
; Nếu bo mạch dùng Quad PSRAM (QSPI), đổi thành: qio_qspi
board_build.arduino.memory_type = qio_opi

; Compilation Flags
build_flags =
    ; Bật PSRAM và tối ưu bộ nhớ đệm
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    
    ; USB CDC On Boot (Quan trọng cho ESP32-S3 để nạp và Serial qua cổng USB Type-C trực tiếp)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    
    ; Debug log level (3 = INFO, 4 = DEBUG)
    -DCORE_DEBUG_LEVEL=3
    
    ; Tích hợp cấu hình LVGL từ thư mục include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    
    ; Tối ưu hóa tốc độ thực thi cho Mini OS
    -O3

; Thư viện phụ thuộc chuẩn (Được ghim phiên bản cố định để bảo đảm tính tái tạo)
lib_deps =
    lovyan03/LovyanGFX @ 1.1.16
    lvgl/lvgl @ 8.3.11
    bodmer/TJpg_Decoder @ 1.1.0
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12

build_type = release
