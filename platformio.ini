; ====================================================================
; PlatformIO Configuration: ES3C28P ESP32-S3 HMI Firmware
; Target: ES3C28P 2.8" IPS 240x320 ILI9341V + FT6336G + SDMMC + ES8311
; Drivers: LovyanGFX (40MHz DMA) + LVGL 8.3.11 + TJpgDec
; Hardware: ESP32-S3 (N16R8) 16MB Flash, 8MB Octal OPI PSRAM
; ====================================================================

[platformio]
default_envs = esp32-s3-es3c28p
src_dir = src
include_dir = include
boards_dir = boards

[env]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1-n16r8
framework = arduino
extra_scripts =
    pre:scripts/framework_wifi_patch.py
    pre:scripts/git_revision.py

; Serial Monitor & Upload configuration
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

; Hardware specifications (16MB Flash, 8MB OPI PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Thư viện phụ thuộc được ghim chính xác phiên bản
lib_deps =
    lvgl/lvgl @ 8.3.11
    lovyan03/LovyanGFX @ 1.1.16
    bodmer/TJpg_Decoder @ 1.1.0
    bblanchon/ArduinoJson @ 6.21.5
    https://github.com/sh123/esp32_opus_arduino.git#a3816682932b8792f90072ee05c33fe25c055628

build_type = release

; --- Target: ES3C28P 2.8" IPS HMI (Màn hình Shopee / Xiaozhi AI Native) ---
[env:esp32-s3-es3c28p]
; Project sources are warning-clean. Dependency/framework warnings are classified in CI.
build_src_flags =
    -Wall
    -Wextra
    -Werror
build_flags =
    -D BOARD_ES3C28P
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

[env:esp32-s3-es3c28p-music-stress]
extends = env:esp32-s3-es3c28p
build_flags =
    ${env:esp32-s3-es3c28p.build_flags}
    -D MINI_OS_MUSIC_STRESS_TEST

[env:esp32-s3-es3c28p-diagnostic]
extends = env:esp32-s3-es3c28p
build_type = debug
build_unflags =
    -Os
    -DCORE_DEBUG_LEVEL=2
build_flags =
    ${env:esp32-s3-es3c28p.build_flags}
    -Og
    -DCORE_DEBUG_LEVEL=4
    -DMINI_OS_DEBUG_PERF
