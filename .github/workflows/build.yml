name: ESP32-S3 Mini OS Firmware CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PlatformIO Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.16"

      - name: Create unprovisioned CI configuration
        # Published CI artifacts must never contain repository/deployment secrets.
        # Credentials are provisioned only in local device-specific builds.
        run: |
          cp include/secrets.example.h include/secrets.h
          python scripts/verify_unprovisioned_config.py include/secrets.h

      - name: Run behavioral regression tests
        run: node simulator/regression_test.js

      - name: Run backend tests
        run: |
          npm ci --prefix backend
          npm test --prefix backend

      - name: Run native C++ firmware contract tests
        run: bash scripts/run_native_tests.sh

      - name: Validate partition contract
        run: python scripts/validate_partitions.py partitions.csv

      - name: Validate dependency provenance
        run: python scripts/verify_dependency_provenance.py

      - name: Run release-tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile release firmware
        run: |
          set -o pipefail
          pio run -e esp32-s3-es3c28p 2>&1 | tee /tmp/build-release.log
          python scripts/check_build_warnings.py /tmp/build-release.log

      - name: Enforce release firmware size budgets
        run: python scripts/verify_size.py /tmp/build-release.log --max-ram 120000 --max-flash 3000000

      - name: Package verified release firmware
        shell: bash
        run: |
          set +e
          package_output=$(python scripts/package_release.py --environment esp32-s3-es3c28p --output release 2>&1)
          package_status=$?
          set -e
          if [ "$package_status" -ne 0 ]; then
            package_output=${package_output//'%'/'%25'}
            package_output=${package_output//$'\r'/'%0D'}
            package_output=${package_output//$'\n'/'%0A'}
            echo "::error title=Release packaging failed::$package_output"
            git status --short --untracked-files=all
            exit "$package_status"
          fi
          printf '%s\n' "$package_output"

      - name: Compile stress and diagnostic firmware
        run: |
          set -o pipefail
          pio run -e esp32-s3-es3c28p-music-stress 2>&1 | tee /tmp/build-stress.log
          python scripts/check_build_warnings.py /tmp/build-stress.log
          pio run -e esp32-s3-es3c28p-diagnostic 2>&1 | tee /tmp/build-diagnostic.log
          python scripts/check_build_warnings.py /tmp/build-diagnostic.log

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp32-s3-es3c28p-${{ github.sha }}
          path: release/
