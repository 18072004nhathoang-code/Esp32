name: ESP32-S3 Mini OS Firmware CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PlatformIO Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.16"

      - name: Create secrets.h from GitHub Secrets
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASS: ${{ secrets.WIFI_PASS }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat << EOF > include/secrets.h
          #pragma once

          // Cấu hình mạng WiFi mặc định từ GitHub Secrets
          #define DEFAULT_WIFI_SSID           "${WIFI_SSID:-}"
          #define DEFAULT_WIFI_PASS           "${WIFI_PASS:-}"

          // Google Maps Static API Key từ GitHub Secrets
          #define GOOGLE_MAPS_STATIC_API_KEY "${MAPS_API_KEY:-}"
          #define MAPS_API_KEY                "${MAPS_API_KEY:-}"

          // Provider API keys stay on the HTTPS backend; firmware gets only
          // its independent gateway bearer token from its deployment config.
          #define CAMERA_TLS_CA_CERT          ""
          EOF

      - name: Run behavioral regression tests
        run: node simulator/regression_test.js

      - name: Run backend tests
        run: |
          npm ci --prefix backend
          npm test --prefix backend

      - name: Run native C++ firmware contract tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/native_contract_test.cpp -o /tmp/native_contract_test
          /tmp/native_contract_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/service_logic_test.cpp src/core/service_state_logic.cpp -o /tmp/service_logic_test
          /tmp/service_logic_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/fault_injection_test.cpp src/core/service_state_logic.cpp -o /tmp/fault_injection_test
          /tmp/fault_injection_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/music_decoder_lifecycle_test.cpp -o /tmp/music_decoder_lifecycle_test
          /tmp/music_decoder_lifecycle_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/ai_voice_protocol_test.cpp -o /tmp/ai_voice_protocol_test
          /tmp/ai_voice_protocol_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/wifi_time_service_test.cpp -o /tmp/wifi_time_service_test
          /tmp/wifi_time_service_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/wifi_scan_adapter_test.cpp -o /tmp/wifi_scan_adapter_test
          /tmp/wifi_scan_adapter_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/xiaozhi_protocol_test.cpp -o /tmp/xiaozhi_protocol_test
          /tmp/xiaozhi_protocol_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/xiaozhi_session_logic_test.cpp -o /tmp/xiaozhi_session_logic_test
          /tmp/xiaozhi_session_logic_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/system_defects_regression_test.cpp -o /tmp/system_defects_regression_test
          /tmp/system_defects_regression_test

      - name: Compile ESP32-S3 Firmware
        run: pio run -e esp32-s3-es3c28p
